name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev,validation]"
      - name: rosbags extra is installed
        run: python -c "import rosbags"
      - name: make test (a rosbags skip fails the job)
        run: make test
        env:
          REPLAYDIFF_REQUIRE_ROSBAGS: "1"
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel in a fresh venv and smoke-run the CLI
        run: tools/ci/smoke_wheel.sh dist
