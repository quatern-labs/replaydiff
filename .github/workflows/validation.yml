name: validation

# Validation experiment (validation/README.md): does an N-replay noise floor on a replayed recording let the
# compare step catch injected regressions, and how often does it say "can't tell" (INCONCLUSIVE)?
#
# Humble only by default (pull_request and push). Jazzy is known-failing: nav2 does not come up in the headless
# simulation on ubuntu-24.04. It runs only on a manual workflow_dispatch with include_jazzy=true, with
# continue-on-error. The distro list below is the single place the matrices are built from.
on:
  workflow_dispatch:
    inputs:
      include_jazzy:
        description: "Also run the Jazzy jobs (known-failing: nav2 does not come up in the headless sim on ubuntu-24.04)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "validation/**"
      - ".github/workflows/validation.yml"

permissions:
  contents: read

jobs:
  # Proves the bound of the nav2 wait with stub processes (no ROS): see validation/ci/test_wait_nav2.sh.
  wait-bound-test:
    name: nav2 wait bound test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: bash -n validation/ci/*.sh
      - name: Hang case (ros2 ignores SIGTERM, NAV2_WAIT_S=20) must exit 1 within 60 s; pass case must pass
        run: validation/ci/test_wait_nav2.sh

  generate:
    name: generate recording (${{ matrix.distro }})
    runs-on: ${{ matrix.distro == 'jazzy' && 'ubuntu-24.04' || 'ubuntu-22.04' }}
    # Official ROS image (Docker Hub "ros"), root, ROS preinstalled: no ros-tooling/setup-ros step (its unauthenticated
    # GitHub API call is rate-limited when many jobs start at once).
    container: ros:${{ matrix.distro }}
    # Known-failing: on jazzy (ubuntu-24.04) nav2 does not come up in the headless sim, so the step
    # "Generate recording" fails (clearly, after its 240 s wait) and the jazzy replays have no recording.
    # Not fixed yet; humble is the priority and the aggregate reports humble only.
    continue-on-error: ${{ matrix.distro == 'jazzy' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(inputs.include_jazzy && '["humble","jazzy"]' || '["humble"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install simulation and analysis dependencies
        run: validation/ci/setup_ros.sh ${{ matrix.distro }} sim
      - name: Generate recording (TurtleBot3 + nav2 simulation, headless)
        timeout-minutes: 15
        run: validation/ci/gen_recording.sh ${{ matrix.distro }} "$RUNNER_TEMP/gen"
      - name: Show simulation logs on failure
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP"/gen/*.log || true
      - name: Upload recording (workflow artifact only, never committed)
        uses: actions/upload-artifact@v4
        with:
          name: recording-${{ matrix.distro }}
          path: ${{ runner.temp }}/gen/recording
          retention-days: 3
          if-no-files-found: error

  replay:
    name: ${{ matrix.distro }} ${{ matrix.rate }}x rep ${{ matrix.rep }}${{ matrix.set == 'near' && ' near-tolerance' || '' }}
    needs: generate
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.distro == 'jazzy' && 'ubuntu-24.04' || 'ubuntu-22.04' }}
    container: ros:${{ matrix.distro }}
    # Known-failing jazzy: no recording exists because nav2 does not start there (see the generate job).
    continue-on-error: ${{ matrix.distro == 'jazzy' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
        rate: ["0.5", "1.0"]
        rep: [1, 2, 3]
        distro: ${{ fromJSON(inputs.include_jazzy && '["humble","jazzy"]' || '["humble"]') }}
        # controls: regressions far past the tolerances; near: 0.5x-1.5x of them (validation/README.md), Humble only
        set: [controls, near]
        exclude:
          - {distro: jazzy, set: near}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: validation/ci/setup_ros.sh ${{ matrix.distro }}
      - uses: actions/download-artifact@v4
        with:
          name: recording-${{ matrix.distro }}
          path: ${{ runner.temp }}/recording
      - name: Replay base x6 and the injected regressions
        run: >
          validation/ci/run_experiment.sh ${{ matrix.distro }} "$RUNNER_TEMP/recording" ${{ matrix.rate }}
          "$RUNNER_TEMP/runs" ${{ matrix.rep }} ${{ matrix.set }}
      - name: Compare (N=3 and N=5)
        run: >
          python3 validation/experiment.py analyze --runs-dir "$RUNNER_TEMP/runs" --distro ${{ matrix.distro }}
          --rate ${{ matrix.rate }} --config validation/tolerances.yaml --set ${{ matrix.set }}
          --out "result-${{ matrix.distro }}-${{ matrix.rate }}-rep${{ matrix.rep }}${{ matrix.set == 'near' && '-near' || '' }}.json"
      - name: Show replay logs on failure
        if: failure()
        run: tail -n 40 "$RUNNER_TEMP"/runs/rep*/*.log || true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: result-${{ matrix.distro }}-${{ matrix.rate }}-rep${{ matrix.rep }}${{ matrix.set == 'near' && '-near' || '' }}
          path: result-*.json
          retention-days: 14
          if-no-files-found: error

  aggregate:
    needs: [replay, wait-bound-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy PyYAML mcap mcap-ros2-support
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: parts
          merge-multiple: true
      - name: Write results/validation.json and results/validation.md
        run: |
          python validation/experiment.py aggregate --inputs parts/result-*.json --out-dir results
          if ! ls parts/result-jazzy-*.json >/dev/null 2>&1; then
            note="**Jazzy is not included in this run (it is known-failing and only runs on a manual dispatch with include_jazzy):** nav2 does not come up in the headless simulation on ubuntu-24.04 (see the 'generate recording (jazzy)' job when it runs). These results are Humble only."
            echo "$note"
            printf '%s\n\n' "$note" | cat - results/validation.md > results/validation.tmp && mv results/validation.tmp results/validation.md
          fi
          cat results/validation.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: results/
          if-no-files-found: error
