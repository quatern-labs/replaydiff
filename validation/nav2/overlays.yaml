# Injected regressions as parameter overlays on nav2's own controller parameters (nav2/params.yaml). Each key is
# node.parameter path; values replace the defaults. Sizes chosen before the first run, from the DWB defaults.
speed_cap20: {controller_server.ros__parameters.FollowPath.max_vel_x: 0.208, controller_server.ros__parameters.FollowPath.max_speed_xy: 0.208}   # -20% speed limit
speed_cap50: {controller_server.ros__parameters.FollowPath.max_vel_x: 0.13, controller_server.ros__parameters.FollowPath.max_speed_xy: 0.13}     # -50%
short_horizon: {controller_server.ros__parameters.FollowPath.sim_time: 0.8}                                  # sim_time 1.7 -> 0.8 s
weak_path_align: {controller_server.ros__parameters.FollowPath.PathAlign.scale: 8.0}                         # critic weight 32 -> 8
