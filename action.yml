name: replaydiff
description: Compare a head replay against base replays with per-topic tolerances; the step result is the compare exit code.
inputs:
  base:
    description: Space-separated base-run MCAP paths (two or more; they set the noise floor).
    required: true
  head:
    description: Head-run MCAP path.
    required: true
  tolerances:
    description: Tolerance YAML file (required; the step fails with a clear message when it is missing).
    required: true
  inconclusive:
    description: "How an INCONCLUSIVE verdict counts: `fail` (exit 2, default) or `pass` (exit 0)."
    default: fail
  comment:
    description: "Post or update one PR comment with the report (needs pull-requests: write)."
    default: "false"
  python-version:
    description: Python version for the CLI.
    default: "3.11"
outputs:
  exit-code:
    description: Exit code of `replaydiff compare` (0 pass, 1 FAIL, 2 inconclusive or error).
    value: ${{ steps.compare.outputs.exit-code }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install replaydiff
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Compare
      id: compare
      shell: bash
      env:
        RD_BASE: ${{ inputs.base }}
        RD_HEAD: ${{ inputs.head }}
        RD_TOLERANCES: ${{ inputs.tolerances }}
        RD_INCONCLUSIVE: ${{ inputs.inconclusive }}
      run: |
        set +e
        "${{ github.action_path }}/tools/ci/action_compare.sh"
        code=$?
        echo "code=$code" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Post PR comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request' && steps.compare.outputs.report != ''
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: replaydiff
        path: ${{ steps.compare.outputs.report }}
    - name: Exit with the compare exit code
      shell: bash
      run: exit "${{ steps.compare.outputs.code }}"
