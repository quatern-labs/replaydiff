name: replaydiff
description: Compare a head replay against base replays with per-topic tolerances and post the report on the pull request.
inputs:
  base:
    description: Space-separated base-run MCAP paths (two or more; they set the noise floor).
    required: true
  head:
    description: Head-run MCAP path.
    required: true
  config:
    description: Tolerance YAML file.
    required: true
  inconclusive:
    description: "How exit code 2 (inconclusive or error) counts: `fail` (default) or `pass`."
    default: fail
  comment:
    description: "Post or update one PR comment with report.md (needs pull-requests: write)."
    default: "true"
  python-version:
    description: Python version for the CLI.
    default: "3.11"
outputs:
  exit-code:
    description: Exit code of `replaydiff compare` (0 pass, 1 FAIL, 2 inconclusive or error).
    value: ${{ steps.compare.outputs.exit-code }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install replaydiff
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Compare
      id: compare
      shell: bash
      env:
        RD_BASE: ${{ inputs.base }}
        RD_HEAD: ${{ inputs.head }}
        RD_CONFIG: ${{ inputs.config }}
      run: |
        set +e
        # shellcheck disable=SC2086  # RD_BASE is a space-separated list
        replaydiff compare --base $RD_BASE --head "$RD_HEAD" --tolerances "$RD_CONFIG" \
          --json report.json --markdown report.md
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        [ -f report.md ] && cat report.md >> "$GITHUB_STEP_SUMMARY"
        exit 0
    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: replaydiff-report
        path: |
          report.md
          report.json
        if-no-files-found: ignore
    - name: Post PR comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request' && hashFiles('report.md') != ''
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: replaydiff
        path: report.md
    - name: Exit with the tool's code
      shell: bash
      env:
        CODE: ${{ steps.compare.outputs.exit-code }}
        INCONCLUSIVE: ${{ inputs.inconclusive }}
      run: |
        if [ "$CODE" = 2 ] && [ "$INCONCLUSIVE" = pass ]; then exit 0; fi
        exit "$CODE"
