[project]
name = "replaydiff"
version = "0.1.0.dev0"
description = "Replay-based differential testing for ROS 2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy",
  "mcap",
  "mcap-ros2-support",
  "PyYAML",
]

[project.scripts]
replaydiff = "replaydiff.cli:main"

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]  # build: Apache-2.0 or MIT (pypa/build, MIT); twine: Apache-2.0 (CI build job only)
validation = ["rosbags"]  # Apache-2.0: SCAND ROS 1 -> ROS 2 conversion (validation/scand.py)

[tool.setuptools]
packages = ["replaydiff"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests", "validation/tests"]
pythonpath = [".", "validation"]
