[project]
name = "replaydiff-validation"
version = "0.0.0"
description = "Replay-based differential testing for ROS 2"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy",
  "mcap",
  "mcap-ros2-support",
  "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests", "validation/tests"]
pythonpath = ["validation"]
